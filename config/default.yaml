# ATLAS Trading AI - default configuration.
# Every value here is validated by app/config.py. Changing a risk value is an
# explicit, logged action (the config hash is recorded at every startup).
app:
  name: "ATLAS Trading AI"
  environment: "dev"
  timezone_user: "Europe/Prague"
  timezone_market: "America/New_York"

paths:
  database: "var/atlas.sqlite3"
  log_dir: "logs"

execution:
  mode: "paper"            # the ONLY allowed value. Anything else fails validation.
  provider: "internal_sim" # internal simulator; "alpaca_paper" only once credentials exist
  leverage_enabled: false  # must stay false
  margin_enabled: false    # must stay false
  allow_short: false
  commission_per_trade_usd: 0.0
  stock_fee_bps: 0.0
  crypto_fee_bps: 5.5      # Bybit USDT-perp TAKER (stop-loss / time / manual exits), per side on full notional
  crypto_maker_fee_bps: 2.0          # D101: Bybit non-VIP maker - post-only limit entries + take-profits
  slippage_bps_crypto_maker: 1.0
  crypto_entry_order: limit          # limit at the bid; fills only if price trades down to it within the TTL
  crypto_limit_ttl_minutes: 15
  slippage_bps_stock: 3.0          # D101: liquid large caps (real bid/ask from the quote adds the spread)
  slippage_bps_crypto: 3.0      # BTC/ETH-class liquidity (global; not per-symbol)
  fractional_stocks: true
  stock_qty_step: 0.001
  crypto_qty_step: 0.000001
  min_notional_usd: 5.0
  assumed_half_spread_bps_stock: 2.0
  assumed_half_spread_bps_crypto: 2.0
  max_order_pct_bar_dollar_volume: 1.0
  manage_timeframe: "1m"
  max_quote_age_seconds: 90
  alpaca_paper_orders_enabled: true    # Alpaca PAPER mirror (paper-api only), approved by Kubiqq 2026-11-24 (DECISIONS D85)

portfolio:
  starting_equity_usd: 1000.0
  base_currency: "USD"

risk:
  max_risk_per_trade_pct: 0.25   # % of current equity -> $2.50 at $1,000
  max_daily_loss_pct: 1.0        # % of starting daily equity -> $10 at $1,000
  max_open_positions: 2
  min_reward_risk: 2.0
  require_stop_loss: true
  require_take_profit: true
  allow_averaging_down: false
  allow_martingale: false
  require_complete_signal: true
  max_position_pct_equity: 50.0
  max_entry_drift_r: 0.25
  max_consecutive_losses_per_day: 3
  symbol_cooldown_minutes_after_loss: 60
  stock_no_new_entries_minutes_before_close: 15
  stock_flatten_minutes_before_close: 5
  stock_overnight_holding: false
  crypto_max_hold_hours: 24

scoring:
  min_score_to_trade: 70
  weights:                 # hypotheses, NOT validated. Must sum to 1.0. News-driven reweight (DECISIONS D77)
    technical: 0.10        # was 0.25 - technicals only confirm the entry
    momentum_volume: 0.10  # was 0.20
    news: 0.40             # was 0.20 - verified news / catalysts drive decisions
    sentiment: 0.15        # was 0.10
    quant: 0.15
    liquidity: 0.10

markets:
  stocks:
    enabled: true
    watchlist: ["SPY", "QQQ", "IWM", "DIA", "SMH", "XLF", "XLE", "XLK", "XLV", "GLD", "SLV", "TLT", "TQQQ", "SOXL", "ARKK", "AAPL", "MSFT", "NVDA", "TSLA", "AMD", "META", "AMZN", "GOOGL", "NFLX", "AVGO", "PLTR", "COIN", "MSTR", "SMCI", "INTC", "MU", "QCOM", "ARM", "TSM", "BABA", "JPM", "BAC", "WFC", "C", "GS", "MS", "V", "MA", "PYPL", "XYZ", "SHOP", "UBER", "ABNB", "CRM", "ORCL", "ADBE", "NOW", "SNOW", "CRWD", "PANW", "NET", "DDOG", "HOOD", "SOFI", "RIVN", "NIO", "F", "GM", "XOM", "CVX", "OXY", "BA", "CAT", "DIS", "NKE", "SBUX", "WMT", "COST", "TGT", "HD", "KO", "PEP", "MCD", "JNJ", "PFE", "MRK", "LLY", "UNH", "ABBV", "CVS", "T", "VZ", "MARA", "RIOT", "APP"]   # 90 liquid US stocks/ETFs, scanned in rotating batches
  crypto:
    enabled: true
    watchlist: ["BTC-USD", "ETH-USD", "SOL-USD", "XRP-USD", "BNB-USD", "ZEC-USD", "NEAR-USD", "HYPE-USD", "UNI-USD", "LINK-USD", "ENA-USD", "SUI-USD", "ADA-USD", "LTC-USD", "WLD-USD", "TAO-USD", "AAVE-USD", "INJ-USD", "ZRO-USD", "SEI-USD", "BCH-USD", "AVAX-USD", "CFG-USD", "XLM-USD", "HBAR-USD", "SKY-USD", "QNT-USD", "FIL-USD", "ONDO-USD", "ARB-USD", "KAVA-USD", "ICP-USD", "DOT-USD", "RENDER-USD", "ETHFI-USD", "ATOM-USD", "OP-USD", "APT-USD", "ETC-USD", "TIA-USD"]   # 40 liquid large-cap pairs (Coinbase + Binance + Bybit USDT-perp), no memecoins

data:
  stock_sources: ["yahoo", "alpaca"]   # alpaca used only when ALPACA_* keys are set (IEX feed, read-only data)
  crypto_sources: ["coinbase", "kraken", "binance"]   # priority order; all used for cross-checks
  include_prepost: true
  # D98: divergent/missing data on a core symbol -> global SAFE STATE (unchanged); on any other
  # wide-universe symbol -> that symbol is quarantined (skipped) for the cycle, the rest keeps trading.
  core_symbols: ["SPY", "QQQ", "AAPL", "MSFT", "NVDA", "TSLA", "AMD", "META", "BTC-USD", "ETH-USD", "SOL-USD"]
  live_max_age_bars: 2.0
  live_grace_seconds: 60
  stale_after_bars: 5.0
  crosscheck_tolerance_bps_crypto: 50   # includes USDT/USD basis for Binance
  crosscheck_tolerance_bps_stock: 100
  crosscheck_halt_bps: 300
  max_bar_change_pct: 20
  min_sources_crypto: 2
  max_quote_spread_bps: 200
  halt_on_invalid_data: true

scanner:
  stock_timeframe: "5m"
  crypto_timeframe: "15m"   # 5m crypto moves are too small vs round-trip costs
  lookback_bars: 400
  stock_batch_size: 30      # symbols per trade cycle; the cursor rotates through the whole watchlist
  crypto_batch_size: 14
  stocks_only_in_market_hours: true
  signal_ttl_bars: 3
  stock_min_avg_dollar_volume: 2000000
  stock_min_price: 5.0
  crypto_max_spread_bps: 10.0
  crypto_min_depth_usd_05: 50000
  # All parameters are initial hypotheses, NOT validated (validation = milestone 6).
  stock_strategies:
    opening_range_breakout: {enabled: true, params: {or_minutes: 15, max_minutes_after_open: 120, min_rvol: 1.5}}
    vwap_reclaim:           {enabled: true, params: {min_bars_below: 3, lookback: 6, min_rvol: 1.2}}
    momentum_breakout:      {enabled: true, params: {donchian: 20, min_roc: 0.3, min_rvol: 1.5, rsi_max: 80}}
    relative_volume_anomaly: {enabled: true, params: {min_rvol: 3.0, close_in_range: 0.75}}
    trend_continuation:     {enabled: true, params: {pullback_bars: 3, rsi_min: 40, rsi_max: 65}}
    sr_breakout:            {enabled: true, params: {min_touches: 2, min_rvol: 1.3}}
    news_momentum:          {enabled: true, params: {min_rvol: 2.0, high_lookback: 6, min_confidence: 0.6, require_verified: 1}}
  crypto_strategies:
    momentum_breakout:      {enabled: true, params: {donchian: 48, min_roc: 0.4, min_rvol: 2.0, rsi_max: 82}}
    volume_expansion:       {enabled: true, params: {min_rvol: 2.5, bars: 2}}
    orderbook_imbalance:    {enabled: false, params: {min_imbalance: 0.3, depth_pct: 0.5}}
    volatility_expansion:   {enabled: true, params: {squeeze_pctile: 20, squeeze_lookback: 100}}
    trend_continuation:     {enabled: false, params: {pullback_bars: 4, rsi_min: 40, rsi_max: 68}}
    sr_breakout:            {enabled: true, params: {min_touches: 2, min_rvol: 1.5}}
    liquidity_change:       {enabled: true, params: {min_history: 5, ask_drop_pct: 50, max_bid_drop_pct: 20}}

news:
  enabled: true
  refresh_minutes: 15
  max_health_age_minutes: 60
  min_source_success_ratio: 0.5
  window_hours: 24
  half_life_hours: 6
  catalyst_hours: 16
  catalyst_session_aware: true   # stocks: after-close earnings/8-Ks stay eligible through the next regular session
  catalyst_max_hours: 96
  filings_lookback_days: 7
  form4_per_ticker: 5
  sec_max_tickers: 12      # rotating slice of the stock watchlist per ingest (SEC fair-access + run time)
  story_similarity: 0.45
  min_tag_confidence: 0.6
  no_news_score: 40
  halt_if_all_sources_fail: true
  finbert_enabled: true          # local CPU FinBERT (ProsusAI/finbert); falls back to lexicon+rules if unloadable

# Milestone 6: backtest / out-of-sample / walk-forward validation feeding the quant score component.
validation:
  enabled: true
  history_days_crypto: 730        # Coinbase public 15m candles
  history_days_stock: 730         # Alpaca IEX 5m bars (free feed, partial volume)
  oos_fraction: 0.4               # first 60 % in-sample, last 40 % out-of-sample (by time)
  walk_forward_blocks: 6          # expanding-window walk-forward, 5 test folds
  wf_min_train_trades: 10
  min_oos_trades: 30              # fewer -> insufficient_data (quant unavailable, never executed)
  min_profit_factor: 1.3          # spec section 14
  max_drawdown_pct: 5.0           # spec section 14
  min_wf_positive_fraction: 0.6
  stress_cost_multiplier: 1.5     # PF must stay > 1 with 50 % higher fees/slippage/spread
  max_age_days: 30                # stale validation -> quant unavailable (incomplete)
  auto_deploy_params: false       # walk-forward-selected parameters are reported, never deployed
  forward_test_strategies: [news_momentum]   # not backtestable -> forward PAPER test on the internal $1,000 ledger (Alpaca PAPER mirror, D85)
  forward_test_quant_score: 50    # neutral quant score while forward-testing (no evidence either way)
  forward_test_target_trades: 30  # judge the forward test after >= 30 closed trades

http:
  timeout_seconds: 10
  user_agent: "ATLAS-Trading-AI/0.1 (paper-trading research; contact: set ATLAS_CONTACT_EMAIL)"

# D100: market regime (daily SPY for stocks, BTC-USD for crypto) x strategy matrix from the backtest
# (scripts/research/regime_matrix.py, stock_strats.py). A strategy only opens trades in the listed cells.
regime:
  enabled: true
  stock_benchmark: SPY
  crypto_benchmark: BTC-USD
  # stocks: no intraday strategy had a positive out-of-sample edge -> watch-only (signals logged, no entries)
  stock_watch_only: true
  matrix:
    crypto:
      momentum_breakout:    [bear/high, bull/low]
      sr_breakout:          [bear/high, bull/low]
      volatility_expansion: [bear/high, bull/low]
      volume_expansion:     [bear/high, bull/low]
      liquidity_change:     [bear/high, bull/low]
    stock:
      opening_range_breakout: []
      vwap_reclaim: []
      momentum_breakout: []
      relative_volume_anomaly: []
      trend_continuation: []
      sr_breakout: []
      news_momentum: []

# D102: local Qwen2.5-3B-Instruct on llama-server (CPU, started by the workflow). News summary + final VETO check.
# Never adds trades. Any failure / timeout / bad output -> entries proceed as before (logged).
llm:
  enabled: true
  url: http://127.0.0.1:8088
  budget_s: 60
  call_timeout_s: 25
  max_candidates: 3
