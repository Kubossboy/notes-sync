# Free paper-trading loop on GitHub Actions. Never print secrets.
name: atlas
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: atlas
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
env:
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
  ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # fixed dashboard project + URL; without these every run created a new random Pages project
  ATLAS_PUBLISH_PROJECT: ${{ secrets.ATLAS_PUBLISH_PROJECT }}
  ATLAS_PUBLISH_SLUG: ${{ secrets.ATLAS_PUBLISH_SLUG }}

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            .wrangler-cache
          key: ${{ runner.os }}-hf-wrangler-v1

      # D102: local LLM (Qwen2.5-3B Q4_K_M via llama.cpp). Any failure here only disables the AI step.
      - id: llmcache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/atlas-llm
          key: llm-qwen25-3b-q4km-llamacpp-b12818-v1

      - name: Fetch LLM (cache miss only)
        id: llmfetch
        if: steps.llmcache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set -euo pipefail
          D=~/.cache/atlas-llm; mkdir -p "$D"
          curl -fsSL https://github.com/ggml-org/llama.cpp/releases/download/b12818/llama-b12818-bin-ubuntu-x64.tar.gz | tar -xz -C "$D"
          curl -fsSL -o "$D/model.part" https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf
          mv "$D/model.part" "$D/qwen2.5-3b-instruct-q4_k_m.gguf"

      - name: Save LLM cache
        if: steps.llmcache.outputs.cache-hit != 'true' && steps.llmfetch.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/atlas-llm
          key: llm-qwen25-3b-q4km-llamacpp-b12818-v1

      - name: Start LLM server in background (loads while deps install)
        continue-on-error: true
        run: |
          D=~/.cache/atlas-llm
          BIN=$(ls "$D"/llama-b12818/llama-server 2>/dev/null || true)
          if [ -z "$BIN" ] || [ ! -f "$D/qwen2.5-3b-instruct-q4_k_m.gguf" ]; then echo "LLM not available; running without it"; exit 0; fi
          T0=$(date +%s%3N)
          LD_LIBRARY_PATH="$(dirname "$BIN")" nohup "$BIN" -m "$D/qwen2.5-3b-instruct-q4_k_m.gguf" -c 4096 -t "$(nproc)" \
            --host 127.0.0.1 --port 8088 > "$RUNNER_TEMP/llama.log" 2>&1 &
          nohup bash -c "for i in \$(seq 1 300); do curl -fs http://127.0.0.1:8088/health >/dev/null && { echo \"LLM loaded in \$(( \$(date +%s%3N) - $T0 )) ms\"; exit; }; sleep 0.5; done; echo 'LLM load timed out'" > "$RUNNER_TEMP/llm_load.txt" 2>&1 &
          echo "llama-server starting"

      - name: Install deps (CPU torch)
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          .venv/bin/pip install -r requirements.txt

      - name: Restore ledger from state branch
        run: |
          set -euo pipefail
          mkdir -p var
          if git fetch origin state:state; then
            git show state:var/atlas.sqlite3 > var/atlas.sqlite3
            echo "restored var/atlas.sqlite3 from state"
          else
            echo "no state branch yet; a fresh ledger will be created on first trade"
          fi

      - name: Apply one-shot resume request (ops/resume.txt)
        run: .venv/bin/python scripts/apply_resume.py || echo "resume request failed"

      - name: Paper trade loop (~4 minutes, 30s apart)
        run: |
          set -euo pipefail
          START=$(date +%s)
          while [ $(( $(date +%s) - START )) -lt 240 ]; do
            .venv/bin/python -m app.main trade --json || echo "trade cycle failed"
            LEFT=$(( 240 - ($(date +%s) - START) ))
            [ "$LEFT" -le 5 ] && break
            sleep 30
          done
          cat "$RUNNER_TEMP/llm_load.txt" 2>/dev/null || echo "LLM: not started"
          .venv/bin/python -c "import json,sqlite3;r=sqlite3.connect('var/atlas.sqlite3').execute(\"select value_json from system_state where key='llm_budget'\").fetchone();print('LLM budget:', r and r[0])" || true

      - name: Export dashboard and publish to Cloudflare Pages
        run: |
          set -euo pipefail
          if [ -z "${ATLAS_PUBLISH_PROJECT:-}" ] || [ -z "${ATLAS_PUBLISH_SLUG:-}" ]; then
            echo "missing ATLAS_PUBLISH_PROJECT / ATLAS_PUBLISH_SLUG secrets; refusing to create a new dashboard URL" >&2
            exit 1
          fi
          bash scripts/publish.sh

      - name: Commit ledger back to state branch
        run: |
          set -euo pipefail
          test -f var/atlas.sqlite3
          mkdir -p "${RUNNER_TEMP}/st/var"
          cp -f var/atlas.sqlite3 "${RUNNER_TEMP}/st/var/atlas.sqlite3"
          export GIT_INDEX_FILE="${RUNNER_TEMP}/state.index"
          export GIT_WORK_TREE="${RUNNER_TEMP}/st"
          git config user.name "sync"
          git config user.email "atlas@localhost"
          rm -f "$GIT_INDEX_FILE"
          if git fetch origin state:state; then
            git read-tree state
          fi
          git add -f var/atlas.sqlite3
          TREE=$(git write-tree)
          PARENT=$(git rev-parse --verify state 2>/dev/null || true)
          if [ -n "$PARENT" ] && [ "$(git rev-parse "$PARENT^{tree}")" = "$TREE" ]; then
            echo "state unchanged"
            exit 0
          fi
          if [ -n "$PARENT" ]; then
            COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m "Update paper ledger")
          else
            COMMIT=$(git commit-tree "$TREE" -m "Initial paper ledger")
          fi
          git push origin "$COMMIT":refs/heads/state

      - name: Chain next run
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          QUEUED=$(gh run list --workflow atlas.yml --repo "$GITHUB_REPOSITORY" --status queued --json databaseId --jq 'length')
          WAITING=$(gh run list --workflow atlas.yml --repo "$GITHUB_REPOSITORY" --status waiting --json databaseId --jq 'length')
          if [ "${QUEUED:-0}" -gt 0 ] || [ "${WAITING:-0}" -gt 0 ]; then
            echo "skip dispatch: a run is already queued or waiting"
            exit 0
          fi
          gh workflow run atlas.yml --ref main
